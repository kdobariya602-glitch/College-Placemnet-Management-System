<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Details - Student PMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<!-- ============================= HEADER START (Top bar / Navbar / Sidebar include) ============================= -->

  <div class="app-wrapper">
    <div id="sidebarContainer"></div>
    <div id="mobileSidebarContainer"></div>
    <div class="main-content" id="mainContent">
      <div id="navbarContainer"></div>
<!-- ============================= HEADER END ============================= -->

<!-- ============================= BODY START (Main Page Content) ============================= -->

      <div class="page-content">
        <div class="page-breadcrumb mb-4">
          <nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="jobs.html">Jobs</a></li><li class="breadcrumb-item active">Details</li></ol></nav>
        </div>
        <div class="content-card">
          <div class="card-body-custom">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
              <div>
                <h3 id="jobTitle">Job Title</h3>
                <p class="text-muted mb-0" id="jobCompany">Company</p>
              </div>
              <a href="#" class="btn btn-primary-custom btn-lg" id="applyBtn">Apply Now</a>
            </div>
            <div class="row g-3 mb-4">
              <div class="col-md-3"><div class="dashboard-card text-center py-3"><i class="bi bi-geo-alt text-danger fs-4"></i><div class="small text-muted mt-1">Location</div><strong id="jobLocation">—</strong></div></div>
              <div class="col-md-3"><div class="dashboard-card text-center py-3"><i class="bi bi-currency-rupee text-danger fs-4"></i><div class="small text-muted mt-1">Salary</div><strong id="jobSalary">—</strong></div></div>
              <div class="col-md-3"><div class="dashboard-card text-center py-3"><i class="bi bi-briefcase text-danger fs-4"></i><div class="small text-muted mt-1">Type</div><strong id="jobType">—</strong></div></div>
              <div class="col-md-3"><div class="dashboard-card text-center py-3"><i class="bi bi-calendar text-danger fs-4"></i><div class="small text-muted mt-1">Deadline</div><strong id="jobDeadline">—</strong></div></div>
            </div>
            <h5 class="mb-3">Job Description</h5>
            <p id="jobDescription" class="text-muted mb-4"></p>
            <div class="row g-4">
              <div class="col-md-4"><h6>Minimum CGPA</h6><p id="jobCgpa">—</p></div>
              <div class="col-md-4"><h6>Openings</h6><p id="jobOpenings">—</p></div>
              <div class="col-md-4"><h6>Eligible Branches</h6><p id="jobBranches">—</p></div>
              <div class="col-12"><h6>Required Skills</h6><div id="jobSkills"></div></div>
            </div>
          </div>
        </div>
      </div>
      
<!-- ============================= BODY END ============================= -->

<!-- ============================= FOOTER START ============================= -->
<div id="footerContainer"></div>
<!-- ============================= FOOTER END ============================= -->

    </div>
  </div>
  <div id="modalContainer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/student.js"></script>
  <script>
    if (App.requireAuth('student', 'login.html')) {
      Components.initLayout('student', 'jobs.html', App.currentUser);
      Student.loadJobDetails();
    }
  </script>
</body>
</html>
